<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Smart Expense Tracker</h1>
      <p>Track your daily expenses easily.</p>
    </header>

    <section class="summary">
      <div class="card">
        <span>Total Expense</span>
        <strong id="totalExpense">₹0.00</strong>
      </div>
      <div class="card">
        <span>Number of Expenses</span>
        <strong id="expenseCount">0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <div class="grid">
          <label>Date
            <input type="date" id="date" required>
          </label>
          <label>Category
            <select id="category" required>
              <option value="">Select category</option>
              <option>Food</option>
              <option>Travel</option>
              <option>Education</option>
              <option>Shopping</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>
          </label>
          <label>Amount (₹)
            <input type="number" id="amount" min="0.01" step="0.01" required>
          </label>
          <label>Description
            <input type="text" id="description" placeholder="e.g. Lunch" required>
          </label>
        </div>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>Expenses</h2>
        <select id="filter">
          <option value="All">All Categories</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Education</option>
          <option>Shopping</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>
      <div id="empty" class="empty">No expenses added yet.</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expenseTable"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
